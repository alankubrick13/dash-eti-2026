[pytest]
testpaths = tests
# --assert=plain: os testes usam dados pessoais reais; sem a inspeção de asserções do pytest,
# uma falha mostra só a linha do teste e a mensagem (contagens), nunca o conteúdo dos dados.
addopts = -ra --assert=plain
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore:.*missing ScriptRunContext.*
markers =
    lento: lê o pacote oficial do Inep em cache (cerca de 1 minuto)
